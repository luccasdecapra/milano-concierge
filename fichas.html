<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fichas Concierge Milano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#12151b; --panel:#181d26; --panel2:#1f2530; --edge:#2b3342;
  --ink:#eef1f6; --ink2:#99a3b5; --ink3:#5e6979;
  --hit:#f2f5fa; --hitink:#12151b;
  --ok:#3fbf7f; --warn:#e8a33d; --bad:#e2565a;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f0ec; --panel:#ffffff; --panel2:#f7f5f1; --edge:#ddd8cf;
    --ink:#16191f; --ink2:#5f6773; --ink3:#949caa;
    --hit:#16191f; --hitink:#ffffff;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--warn);outline-offset:2px}

/* ---- topo ---- */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);
  border-bottom:1px solid var(--edge);padding:12px 16px 0;
}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.2px}
.brand .ct{margin-left:auto;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{
  flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--edge);
  font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap;display:flex;gap:7px;align-items:center;
}
.wk .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.wk[aria-pressed="true"]{background:var(--hit);color:var(--hitink);border-color:var(--hit)}
.wk .n{font-variant-numeric:tabular-nums;opacity:.65;font-size:11px}

/* ---- lista ---- */
main{padding:14px 16px 96px;max-width:760px;margin:0 auto}
.themeline{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.themeline b{font-size:20px;font-weight:700;letter-spacing:-.3px}
.themeline span{font-size:13px;color:var(--ink2)}
.bar{height:3px;border-radius:2px;background:var(--edge);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;transition:width .3s}
.card{
  background:var(--panel);border:1px solid var(--edge);border-left:3px solid var(--edge);
  border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;
  width:100%;text-align:left;
}
.card.done{border-left-color:var(--ok)}
.card .body{min-width:0;flex:1}
.card .nm{font-weight:600;font-size:15.5px;line-height:1.25;margin-bottom:3px}
.card .meta{font-size:12.5px;color:var(--ink2)}
.card .tags{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--panel2);color:var(--ink2);border:1px solid var(--edge)}
.tag.sc{color:var(--ok);border-color:var(--ok)}
.card .st{flex:0 0 auto;font-size:12px;color:var(--ink3);text-align:right;padding-top:2px}
.card .st b{display:block;font-size:19px;color:var(--ok);font-weight:700;line-height:1.1}

/* ---- ficha ---- */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none}
.sheet.open{display:block}
.sheet .inner{padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 110px);max-width:760px;margin:0 auto}
.shead{position:sticky;top:0;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--edge);margin-bottom:16px;z-index:5}
.shead .row{display:flex;gap:12px;align-items:flex-start}
.shead h2{margin:0;font-size:19px;font-weight:700;line-height:1.2;letter-spacing:-.3px}
.shead p{margin:5px 0 0;font-size:13px;color:var(--ink2)}
.x{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--edge);font-size:17px;line-height:1}
.info{background:var(--panel2);border:1px solid var(--edge);border-radius:10px;padding:11px 13px;margin-bottom:18px;font-size:13px;color:var(--ink2)}
.info div{margin:3px 0}
.info a{color:inherit}
.info b{color:var(--ink);font-weight:600}
.grp{margin-bottom:18px}
.grp>label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:7px}
.grp>label em{font-style:normal;font-weight:400;color:var(--ink3)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{
  padding:9px 13px;border-radius:8px;border:1px solid var(--edge);background:var(--panel);
  font-size:13.5px;color:var(--ink2);line-height:1.2;
}
.opt[aria-pressed="true"]{background:var(--hit);color:var(--hitink);border-color:var(--hit);font-weight:600}
.opt.no[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.mb[aria-pressed="true"]{background:var(--ink3);border-color:var(--ink3);color:#fff}
.stars{display:flex;gap:6px}
.star{width:46px;height:44px;border-radius:8px;border:1px solid var(--edge);font-size:16px;font-weight:700;color:var(--ink3)}
.star[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#06210f}
.tog{display:flex;gap:6px}
.tog .opt{flex:1;text-align:center}
textarea{
  width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--edge);
  border-radius:9px;padding:11px;font:inherit;font-size:14.5px;resize:vertical;min-height:74px;
}
textarea::placeholder{color:var(--ink3)}
details{border-top:1px solid var(--edge);padding-top:14px;margin-top:4px}
details summary{font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer;margin-bottom:14px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ ";color:var(--ink3)}
details[open] summary::before{content:"– "}
.savebar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel);border-top:1px solid var(--edge);
  padding:11px 16px calc(env(safe-area-inset-bottom,0px) + 11px);display:flex;gap:10px;align-items:center;
}
.savebar .msg{font-size:12.5px;color:var(--ink2);flex:1}
.btn{padding:11px 20px;border-radius:9px;background:var(--hit);color:var(--hitink);font-weight:700;font-size:14.5px}
.btn.ghost{background:none;border:1px solid var(--edge);color:var(--ink2);font-weight:600}

/* ---- abas ---- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--panel);
  border-top:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom,0px);
}
.tabs button{flex:1;padding:12px 4px 13px;font-size:12px;color:var(--ink3);font-weight:600}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button span{display:block;font-size:17px;margin-bottom:2px}

/* ---- consulta ---- */
.res{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:14px;margin-bottom:10px}
.res .rk{font-size:12px;font-weight:700;color:var(--ink3);margin-bottom:5px}
.res .nm{font-size:17px;font-weight:700;margin-bottom:5px;letter-spacing:-.2px}
.res .meta{font-size:13px;color:var(--ink2);margin-bottom:8px}
.res .why{font-size:13.5px;line-height:1.5}
.res .why b{font-weight:600}
.empty{border:1px dashed var(--edge);border-radius:10px;padding:26px 18px;text-align:center;color:var(--ink2);font-size:14px}
pre.csv{background:var(--panel);border:1px solid var(--edge);border-radius:9px;padding:11px;font-size:10.5px;
  max-height:240px;overflow:auto;white-space:pre;color:var(--ink2)}
.hint{font-size:12.5px;color:var(--ink3);margin:8px 0 0}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Fichas Concierge Milano</h1>
    <span class="ct" id="count"></span>
  </div>
  <div id="weekwrap"><div class="weeks" id="weeks"></div></div>
</header>

<main>
  <section id="pane-fichas">
    <div class="themeline"><b id="theme"></b><span id="themesub"></span></div>
    <div class="bar"><i id="bar"></i></div>
    <div id="list"></div>
  </section>
  <section id="pane-consulta" style="display:none">
    <div class="themeline"><b>Quem é o hóspede</b></div>
    <div id="query"></div>
    <div class="themeline" style="margin-top:22px"><b>Resultado</b></div>
    <div id="qout"></div>
  </section>
  <section id="pane-export" style="display:none">
    <div class="themeline"><b>Suas anotações</b></div>
    <div id="export"></div>
  </section>
</main>

<div class="sheet" id="sheet"><div class="inner" id="sheetinner"></div>
  <div class="savebar">
    <span class="msg" id="msg"></span>
    <button class="btn" id="sheetsave">Pronto</button>
  </div>
</div>

<nav class="tabs">
  <button id="tab-fichas" aria-selected="true"><span>▤</span>Fichas</button>
  <button id="tab-consulta" aria-selected="false"><span>◎</span>Consulta</button>
  <button id="tab-export" aria-selected="false"><span>↧</span>Exportar</button>
</nav>

const KEY = 'fichas-milano-v1';
let recs = {};
try { recs = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) { recs = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(recs)); } catch(e){ toast('Não consegui salvar neste navegador.'); } }
function rec(id){ if(!recs[id]) recs[id] = {}; return recs[id]; }
function done(id){ const r = recs[id]; return !!(r && r.visitado); }

let week = 1, cur = null, tab = 'fichas';
const $ = s => document.querySelector(s);
const el = (t,c,x) => { const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; };

function toast(m){ const t=$('#msg'); if(t){ t.textContent=m; setTimeout(()=>{ if(t.textContent===m) t.textContent=''; },2600);} }

/* ---------- lista ---------- */
function renderWeeks(){
  const w = $('#weeks'); w.innerHTML='';
  for(let i=1;i<=D.temas.length;i++){
    const tot = D.places.filter(p=>p.sem===i).length;
    const dn = D.places.filter(p=>p.sem===i && done(p.id)).length;
    const b = el('button','wk');
    b.setAttribute('aria-pressed', i===week);
    const dot = el('span','dot'); dot.style.background = D.cores[i-1];
    b.appendChild(dot); b.appendChild(el('span',null,'Semana '+i));
    b.appendChild(el('span','n',dn+'/'+tot));
    b.onclick = ()=>{ week=i; renderWeeks(); renderList(); };
    w.appendChild(b);
  }
  const all = D.places.filter(p=>done(p.id)).length;
  $('#count').textContent = all + ' de ' + D.places.length + ' fichas';
}

function renderList(){
  const list = $('#list'); list.innerHTML='';
  const ps = D.places.filter(p=>p.sem===week);
  const dn = ps.filter(p=>done(p.id)).length;
  $('#theme').textContent = D.temas[week-1];
  $('#themesub').textContent = dn + ' de ' + ps.length + ' visitados';
  const bar = $('#bar'); bar.style.width = (ps.length? dn/ps.length*100 : 0) + '%';
  bar.style.background = D.cores[week-1];
  ps.forEach(p=>{
    const r = recs[p.id] || {};
    const c = el('button','card' + (done(p.id)?' done':''));
    const body = el('div','body');
    body.appendChild(el('div','nm',p.nome));
    body.appendChild(el('div','meta', p.cat + ' · ' + p.bairro + (p.fecha && p.fecha!=='Nunca' ? ' · fecha ' + p.fecha.toLowerCase() : '')));
    const tags = el('div','tags');
    (r.faixa? [r.faixa]:[]).concat(r.ocasiao||[], r.composicao||[]).slice(0,4).forEach(t=> tags.appendChild(el('span','tag',t)));
    if(r.lgbtq==='Sim') tags.appendChild(el('span','tag sc','LGBTQIA+ friendly'));
    if(tags.children.length) body.appendChild(tags);
    c.appendChild(body);
    const st = el('div','st');
    if(r.nota){ const b=el('b',null,r.nota); st.appendChild(b); st.appendChild(el('span',null,'nota')); }
    else st.textContent = done(p.id) ? 'sem nota' : 'a visitar';
    c.appendChild(st);
    c.onclick = ()=>openSheet(p.id);
    list.appendChild(c);
  });
}

/* ---------- ficha ---------- */
function group(label, hint){
  const g = el('div','grp');
  const l = el('label'); l.appendChild(document.createTextNode(label));
  if(hint){ const e=el('em',null,'  '+hint); l.appendChild(e); }
  g.appendChild(l); return g;
}
function single(g, id, field, opts, cls){
  const box = el('div','opts');
  opts.forEach(o=>{
    const b = el('button','opt'+(cls?' '+cls:''), o);
    const set = ()=> b.setAttribute('aria-pressed', rec(id)[field]===o);
    set();
    b.onclick = ()=>{ const r=rec(id); r[field] = (r[field]===o? null : o); save(); box.querySelectorAll('.opt').forEach((x,i)=>x.setAttribute('aria-pressed', r[field]===opts[i])); touched(id); };
    box.appendChild(b);
  });
  g.appendChild(box); return g;
}
function multi(g, id, field, opts, cls){
  const box = el('div','opts');
  opts.forEach(o=>{
    const b = el('button','opt'+(cls?' '+cls:''), o);
    const has = ()=> (rec(id)[field]||[]).indexOf(o)>-1;
    b.setAttribute('aria-pressed', has());
    b.onclick = ()=>{ const r=rec(id); r[field]=r[field]||[]; const i=r[field].indexOf(o);
      if(i>-1) r[field].splice(i,1); else r[field].push(o);
      b.setAttribute('aria-pressed', has()); save(); touched(id); };
    box.appendChild(b);
  });
  g.appendChild(box); return g;
}
function text(g, id, field, ph){
  const t = el('textarea'); t.placeholder = ph; t.value = rec(id)[field]||'';
  t.oninput = ()=>{ rec(id)[field]=t.value; };
  t.onblur = ()=>{ save(); touched(id); };
  g.appendChild(t); return g;
}
function touched(id){ const r=rec(id); if(!r.data) r.data = new Date().toISOString().slice(0,10); save(); $('#msg').textContent='Salvo'; setTimeout(()=>{ if($('#msg').textContent==='Salvo') $('#msg').textContent=''; },1200); }

function openSheet(id){
  cur = id;
  const p = D.places.find(x=>x.id===id), r = rec(id), v = D.vocab;
  const inner = $('#sheetinner'); inner.innerHTML='';

  const h = el('div','shead'); const row = el('div','row');
  const hb = el('div'); hb.style.flex='1';
  hb.appendChild(el('h2',null,p.nome));
  hb.appendChild(el('p',null,'Semana '+p.sem+' · '+p.cat+' · '+p.bairro));
  row.appendChild(hb);
  const x = el('button','x','✕'); x.setAttribute('aria-label','Fechar'); x.onclick = closeSheet;
  row.appendChild(x); h.appendChild(row); inner.appendChild(h);

  const info = el('div','info');
  const add = (k,val,href)=>{ if(!val) return; const d=el('div'); d.appendChild(el('b',null,k+': '));
    if(href){ const a=el('a',null,val); a.href=href; d.appendChild(a); } else d.appendChild(document.createTextNode(val));
    info.appendChild(d); };
  add('Endereço', p.end); add('Telefone', p.tel, p.tel? 'tel:'+p.tel.replace(/\s/g,'') : null);
  add('Site', p.site, p.site? 'https://'+p.site : null);
  add('Horário', p.hor); add('Fecha', p.fecha); add('Reserva', p.reserva);
  add('Transporte', p.transp); if(p.dur) add('Duração', p.dur+' min');
  info.appendChild(el('div','hint','Confirme horário no dia antes de mandar um hóspede.'));
  inner.appendChild(info);

  const gv = group('Já visitei');
  const tg = el('div','tog');
  ['Sim','Ainda não'].forEach((o,i)=>{
    const b = el('button','opt',o);
    b.setAttribute('aria-pressed', i===0 ? !!r.visitado : !r.visitado);
    b.onclick = ()=>{ r.visitado = (i===0); save(); openSheet(id); renderWeeks(); renderList(); };
    tg.appendChild(b);
  });
  gv.appendChild(tg); inner.appendChild(gv);

  const gn = group('Nota', '1 fraco · 5 excelente');
  const sb = el('div','stars');
  [1,2,3,4,5].forEach(n=>{
    const b = el('button','star',String(n));
    b.setAttribute('aria-pressed', r.nota===n);
    b.onclick = ()=>{ r.nota = (r.nota===n? null : n); save(); touched(id);
      sb.querySelectorAll('.star').forEach((x,i)=>x.setAttribute('aria-pressed', r.nota===i+1)); renderList(); };
    sb.appendChild(b);
  });
  gn.appendChild(sb); inner.appendChild(gn);

  inner.appendChild(single(group('Faixa de preço'), id, 'faixa', v.faixa));
  inner.appendChild(multi(group('Serve bem para', 'pode marcar vários'), id, 'composicao', v.composicao));
  inner.appendChild(multi(group('Faixa etária'), id, 'idade', v.idade));
  inner.appendChild(multi(group('Ocasião'), id, 'ocasiao', v.ocasiao));
  inner.appendChild(single(group('Ruído'), id, 'ruido', v.ruido));
  inner.appendChild(single(group('Tamanho de grupo que cabe'), id, 'grupo', v.grupo));

  const tri = (label, field) => {
    const g = group(label);
    const box = el('div','tog');
    v.tri.forEach(o=>{
      const cls = o==='Não' ? 'no' : (o==='Não sei' ? 'mb' : '');
      const b = el('button','opt'+(cls?' '+cls:''), o);
      b.setAttribute('aria-pressed', r[field]===o);
      b.onclick = ()=>{ r[field] = (r[field]===o? null : o); save(); touched(id);
        box.querySelectorAll('.opt').forEach((x,i)=>x.setAttribute('aria-pressed', r[field]===v.tri[i])); renderList(); };
      box.appendChild(b);
    });
    g.appendChild(box); return g;
  };
  inner.appendChild(tri('Serve com chuva', 'chuva'));
  inner.appendChild(tri('LGBTQIA+ friendly', 'lgbtq'));
  inner.appendChild(tri('Acessível (mobilidade reduzida)', 'acessivel'));

  inner.appendChild(text(group('Descrição do lugar', 'use o ditado do celular'), id, 'descricao',
    'Como é o lugar, com suas palavras.'));
  inner.appendChild(text(group('Ponto forte', 'o que você contaria a um hóspede'), id, 'pontoForte',
    'Ex.: a sala do Mantegna fica vazia às 9h.'));
  inner.appendChild(text(group('Plano B', 'o equivalente mais próximo'), id, 'planoB',
    'Ex.: Ambrosiana, 8 min a pé.'));

  const det = el('details');
  det.appendChild(el('summary',null,'Detalhes (opcional)'));
  det.appendChild(single(group('Espera'), id, 'espera', v.espera));
  det.appendChild(single(group('Até que horas'), id, 'ateTarde', v.ateTarde));
  det.appendChild(tri('Aceita cães', 'pet'));
  det.appendChild(multi(group('Não indicar para'), id, 'naoIndicar', v.naoIndicar, 'no'));
  det.appendChild(multi(group('Pontos fracos'), id, 'fracos', v.fracos, 'no'));
  inner.appendChild(det);

  $('#sheet').classList.add('open');
  document.body.style.overflow='hidden';
  $('#sheet').scrollTop = 0;
}
function closeSheet(){ save(); $('#sheet').classList.remove('open'); document.body.style.overflow=''; cur=null; renderWeeks(); renderList(); }

  opts.forEach(o=>{
    const b = el('button','opt',o);
    b.setAttribute('aria-pressed', Q[key]===o);
    b.onclick = ()=>{ Q[key]=o; box.querySelectorAll('.opt').forEach((x,i)=>x.setAttribute('aria-pressed', Q[key]===opts[i])); runQuery(); };
    box.appendChild(b);
  });
  g.appendChild(box); return g;
}

function score(p){
  const r = recs[p.id] || {};
  if(Q.sovis==='Sim' && !r.visitado) return -1;
  if(Q.dia!=='Qualquer' && p.fecha===Q.dia) return -1;
  if(Q.lgbtq==='Sim' && r.lgbtq!=='Sim') return -1;
  if(Q.acess==='Sim' && r.acessivel!=='Sim') return -1;
  const ni = r.naoIndicar||[];
  if(Q.composicao!=='Qualquer' && ni.indexOf(Q.composicao)>-1) return -1;
  if(Q.idade!=='Qualquer' && ni.indexOf(Q.idade)>-1) return -1;
  let s = 0;
  if(Q.composicao==='Qualquer') s+=1; else if((r.composicao||[]).indexOf(Q.composicao)>-1) s+=3;
  if(Q.idade==='Qualquer') s+=1; else if((r.idade||[]).indexOf(Q.idade)>-1 || (r.idade||[]).indexOf('Indiferente')>-1) s+=2;
  if(Q.ocasiao==='Qualquer') s+=1; else if((r.ocasiao||[]).indexOf(Q.ocasiao)>-1) s+=3;
  if(Q.faixa!=='Qualquer'){ const f = r.faixa || p.faixaBase; if(f===Q.faixa) s+=2; else s-=1; }
  if(Q.chuva==='Sim'){ if(r.chuva==='Sim') s+=3; else if(r.chuva==='Não') s-=6; }
  if(Q.cat!=='Qualquer'){ if(p.cat===Q.cat) s+=2; else s-=3; }
  if(Q.bairro!=='Qualquer'){ if(p.bairro===Q.bairro) s+=2; else s-=1; }
  if(Q.grupo!=='Qualquer'){ const ord=D.vocab.grupo; const need=ord.indexOf(Q.grupo), has=ord.indexOf(r.grupo||'');
    if(has<0) s-=0.5; else if(has>=need) s+=2; else s-=5; }
  s += (r.nota||0);
  if(r.visitado) s += 0.5;
  return s;
}

function runQuery(){
  const out = $('#qout'); out.innerHTML='';
  const ranked = D.places.map(p=>({p, s:score(p)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,3);
  if(!ranked.length){
    out.appendChild(el('div','empty','Nenhum lugar atende. Alargue os critérios, ou preencha mais fichas — a consulta usa o que você marcou.'));
    return;
  }
  const lab = ['A — principal','B — equivalente','C — alternativa'];
  ranked.forEach((x,i)=>{
    const r = recs[x.p.id]||{};
    const c = el('div','res');
    c.appendChild(el('div','rk',lab[i]));
    c.appendChild(el('div','nm',x.p.nome));
    const bits = [x.p.cat, x.p.bairro, r.faixa||x.p.faixaBase];
    if(x.p.transp) bits.push(x.p.transp);
    c.appendChild(el('div','meta',bits.filter(Boolean).join(' · ')));
    const why = el('div','why');
    if(r.pontoForte){ const b=el('b',null,'Ponto forte: '); why.appendChild(b); why.appendChild(document.createTextNode(r.pontoForte)); why.appendChild(el('br')); }
    if(r.planoB){ const b=el('b',null,'Plano B: '); why.appendChild(b); why.appendChild(document.createTextNode(r.planoB)); why.appendChild(el('br')); }
    if(r.fracos && r.fracos.length){ const b=el('b',null,'Atenção: '); why.appendChild(b); why.appendChild(document.createTextNode(r.fracos.join(', '))); }
    if(!why.children.length && !why.textContent) why.appendChild(document.createTextNode('Ficha ainda sem anotações suas.'));
    c.appendChild(why);
    out.appendChild(c);
  });
}

function renderQuery(){
  const q = $('#query'); q.innerHTML='';
  const v = D.vocab, any = ['Qualquer'];
  q.appendChild(qrow('Composição', 'composicao', any.concat(v.composicao)));
  q.appendChild(qrow('Faixa etária', 'idade', any.concat(v.idade.filter(x=>x!=='Indiferente'))));
  q.appendChild(qrow('Ocasião', 'ocasiao', any.concat(v.ocasiao)));
  q.appendChild(qrow('Faixa de preço', 'faixa', any.concat(v.faixa)));
  q.appendChild(qrow('Dia da semana', 'dia', any.concat(v.dias)));
  q.appendChild(qrow('Está chovendo', 'chuva', ['Não','Sim']));
  q.appendChild(qrow('Tamanho do grupo', 'grupo', any.concat(v.grupo)));
  q.appendChild(qrow('Categoria', 'cat', any.concat(D.cats)));
  q.appendChild(qrow('Bairro', 'bairro', any.concat(D.bairros)));
  q.appendChild(qrow('Precisa ser LGBTQIA+ friendly', 'lgbtq', ['Não','Sim']));
  q.appendChild(qrow('Precisa ser acessível', 'acess', ['Não','Sim']));
  q.appendChild(qrow('Só lugares que já visitei', 'sovis', ['Não','Sim']));
  runQuery();
}

/* ---------- exportar ---------- */
const COLS = ['sem','nome','cat','bairro','end','tel','site','fecha','hor','reserva','transp'];
const RCOLS = ['visitado','data','nota','faixa','composicao','idade','ocasiao','ruido','grupo',
               'chuva','lgbtq','acessivel','pet','espera','ateTarde','naoIndicar','fracos',
               'descricao','pontoForte','planoB'];
function csv(){
  const head = ['Semana','Nome','Categoria','Bairro','Endereço','Telefone','Site','Fecha','Horário','Reserva','Transporte',
    'Visitado','Data','Nota','Faixa','Serve para','Faixa etária','Ocasião','Ruído','Grupo',
    'Chuva','LGBTQIA+ friendly','Acessível','Cães','Espera','Até tarde','Não indicar para','Pontos fracos',
    'Descrição','Ponto forte','Plano B'];
  const esc = s => '"' + String(s==null?'':s).replace(/"/g,'""') + '"';
  const rows = [head.map(esc).join(',')];
  D.places.forEach(p=>{
    const r = recs[p.id]||{};
    const a = COLS.map(k=>p[k]);
    const b = RCOLS.map(k=>{ const val=r[k]; return Array.isArray(val)? val.join('; ') : (k==='visitado'? (val?'Sim':'Não') : val); });
    rows.push(a.concat(b).map(esc).join(','));
  });
  return rows.join('\n');
}
function renderExport(){
  const e = $('#export'); e.innerHTML='';
  const dn = D.places.filter(p=>done(p.id)).length;
  const nt = D.places.filter(p=>(recs[p.id]||{}).nota).length;
  const st = el('div','info');
  st.appendChild(el('div',null,'Visitados: '+dn+' de '+D.places.length));
  st.appendChild(el('div',null,'Com nota: '+nt));
  e.appendChild(st);
  const c = el('button','btn','Copiar tabela (CSV)');
  c.onclick = ()=>{ const t=csv();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(()=>toast('Copiado. Cole numa planilha.'), ()=>toast('Selecione o texto abaixo e copie à mão.'));
    } else toast('Selecione o texto abaixo e copie à mão.'); };
  e.appendChild(c);
  e.appendChild(el('p','hint','Cole numa planilha em branco e use "texto para colunas" com vírgula, ou cole direto no Google Sheets.'));
  const pre = el('pre','csv', csv());
  e.appendChild(pre);
  const r = el('button','btn ghost','Apagar tudo');
  r.style.marginTop='14px';
  r.onclick = ()=>{ if(confirm('Apagar todas as suas anotações? Não dá para desfazer.')){ recs={}; save(); renderWeeks(); renderList(); renderExport(); toast('Anotações apagadas.'); } };
  e.appendChild(r);
  e.appendChild(el('p','hint','As anotações ficam só neste aparelho e neste navegador. Copie o CSV de vez em quando.'));
}

/* ---------- abas ---------- */
function setTab(t){
  tab = t;
  ['fichas','consulta','export'].forEach(k=>{
    $('#pane-'+k).style.display = (k===t? 'block':'none');
    $('#tab-'+k).setAttribute('aria-selected', k===t);
  });
  $('#weekwrap').style.display = (t==='fichas'? 'block':'none');
  if(t==='consulta') renderQuery();
  if(t==='export') renderExport();
}

renderWeeks(); renderList(); setTab('fichas');
$('#tab-fichas').onclick = ()=>setTab('fichas');
$('#tab-consulta').onclick = ()=>setTab('consulta');
$('#tab-export').onclick = ()=>setTab('export');
$('#sheetsave').onclick = closeSheet;
window.addEventListener('beforeunload', save);
